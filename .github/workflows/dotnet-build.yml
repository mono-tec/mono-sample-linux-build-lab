name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release Linux x64 applications
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 共通準備
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Display .NET information
        run: dotnet --info

      # Gitタグの先頭にあるvを除去し、
      # debパッケージと.NETアプリのバージョンに使用します。
      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      # debパッケージの作成に使用します。
      - name: Install Debian package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      # ============================================================
      # LinuxBuildLab.Sample
      # ============================================================

      - name: Restore sample dependencies
        run: >
          dotnet restore
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --runtime linux-x64

      - name: Build sample application
        run: >
          dotnet build
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --configuration Release
          --runtime linux-x64
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Publish sample application
        run: >
          dotnet publish
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output publish/linux-build-lab-sample
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      # 前章との互換性を残すため、
      # sampleアプリはZIP形式でも配布します。
      - name: Create sample ZIP archive
        shell: bash
        run: |
          cd publish/linux-build-lab-sample
          zip -r ../LinuxBuildLab.Sample-linux-x64.zip .

      - name: Create sample Debian package
        shell: bash
        run: |
          chmod +x packaging/sample-deb/build-deb.sh

          PACKAGE_VERSION="${VERSION}" \
          PUBLISH_DIR="${GITHUB_WORKSPACE}/publish/linux-build-lab-sample" \
          ./packaging/sample-deb/build-deb.sh

      # ============================================================
      # LinuxBuildLab.Camera
      # ============================================================

      - name: Restore camera dependencies
        run: >
          dotnet restore
          src/LinuxBuildLab.Camera/LinuxBuildLab.Camera.csproj
          --runtime linux-x64

      - name: Build camera application
        run: >
          dotnet build
          src/LinuxBuildLab.Camera/LinuxBuildLab.Camera.csproj
          --configuration Release
          --runtime linux-x64
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Publish camera application
        run: >
          dotnet publish
          src/LinuxBuildLab.Camera/LinuxBuildLab.Camera.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output publish/linux-build-lab-camera
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Create camera Debian package
        shell: bash
        run: |
          chmod +x packaging/camera-deb/build-deb.sh

          PACKAGE_VERSION="${VERSION}" \
          PUBLISH_DIR="${GITHUB_WORKSPACE}/publish/linux-build-lab-camera" \
          ./packaging/camera-deb/build-deb.sh

      # ============================================================
      # 成果物の登録
      # ============================================================

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LinuxBuildLab-linux-x64
          path: |
            publish/LinuxBuildLab.Sample-linux-x64.zip
            artifacts/packages/linux-build-lab-sample_${{ env.VERSION }}_amd64.deb
            artifacts/packages/linux-build-lab-camera_${{ env.VERSION }}_amd64.deb
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/LinuxBuildLab.Sample-linux-x64.zip
            artifacts/packages/linux-build-lab-sample_${{ env.VERSION }}_amd64.deb
            artifacts/packages/linux-build-lab-camera_${{ env.VERSION }}_amd64.deb
          generate_release_notes: true