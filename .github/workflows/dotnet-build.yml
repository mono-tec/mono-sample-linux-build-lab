name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release Linux x64 application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Display .NET information
        run: dotnet --info

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: Restore dependencies
        run: >
          dotnet restore
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --runtime linux-x64

      - name: Build
        run: >
          dotnet build
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --configuration Release
          --runtime linux-x64
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Publish for Linux x64
        run: >
          dotnet publish
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output publish/linux-x64
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Create ZIP archive
        shell: bash
        run: |
          cd publish/linux-x64
          zip -r ../LinuxBuildLab.Sample-linux-x64.zip .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: LinuxBuildLab.Sample-linux-x64
          path: publish/LinuxBuildLab.Sample-linux-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/LinuxBuildLab.Sample-linux-x64.zip
          generate_release_notes: true