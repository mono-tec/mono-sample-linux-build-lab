name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release Linux x64 packages
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. .NET SDK
      # ============================================================
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Display .NET information
        run: dotnet --info

      # ============================================================
      # 3. Gitタグからバージョンを取得
      #
      # 例:
      #   v0.3.3
      #     ↓
      #   0.3.3
      #
      # このVERSIONを、
      # ・.NET Assembly Version
      # ・SBOM Version
      # ・deb Version
      # で共通利用します。
      # ============================================================
      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      # ============================================================
      # 4. Restore
      #
      # Sample / Camera の両プロジェクトを
      # linux-x64向けにRestoreします。
      # ============================================================
      - name: Restore Sample
        run: >
          dotnet restore
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --runtime linux-x64

      - name: Restore Camera
        run: >
          dotnet restore
          src/LinuxBuildLab.Camera/LinuxBuildLab.Camera.csproj
          --runtime linux-x64

      # ============================================================
      # 5. Build
      # ============================================================
      - name: Build Sample
        run: >
          dotnet build
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --configuration Release
          --runtime linux-x64
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Build Camera
        run: >
          dotnet build
          src/LinuxBuildLab.Camera/LinuxBuildLab.Camera.csproj
          --configuration Release
          --runtime linux-x64
          --no-restore
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      # ============================================================
      # 6. Linux x64向けPublish
      #
      # debへ格納する実行ファイルを作成します。
      # Framework-dependentで発行するため、
      # 実行環境には.NET Runtimeが必要です。
      # ============================================================
      - name: Publish Sample for Linux x64
        run: >
          dotnet publish
          src/LinuxBuildLab.Sample/LinuxBuildLab.Sample.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output artifacts/publish/linux-build-lab-sample
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      - name: Publish Camera for Linux x64
        run: >
          dotnet publish
          src/LinuxBuildLab.Camera/LinuxBuildLab.Camera.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --no-restore
          --output artifacts/publish/linux-build-lab-camera
          -p:Version=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true

      # ============================================================
      # 7. sbom-toolをインストール
      #
      # GitHub Actions Runner上だけに配置します。
      # 製品実行環境へsbom-toolを導入する必要はありません。
      # ============================================================
      - name: Install sbom-tool
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"

          curl -Lo "$HOME/.local/bin/sbom-tool" \
            https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64

          chmod +x "$HOME/.local/bin/sbom-tool"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 8. ONOTをインストール
      #
      # ローカルWSL環境で動作確認した1.1.2へ固定します。
      #
      # ONOTもGitHub Actions Runner上だけで使用し、
      # 製品実行環境には含めません。
      # ============================================================
      - name: Install ONOT
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/onot-venv"
          source "$RUNNER_TEMP/onot-venv/bin/activate"

          pip install --upgrade pip
          pip install "onot[spdx,cyclonedx,excel,api]==1.1.2"

      # ============================================================
      # 9. Sample SBOM生成
      # ============================================================
      - name: Generate Sample SBOM
        shell: bash
        run: |
          sbom-tool generate \
            -b ./artifacts/publish/linux-build-lab-sample \
            -bc ./src/LinuxBuildLab.Sample \
            -pn linux-build-lab-sample \
            -pv "$VERSION" \
            -ps mono-tec \
            -nsb "https://github.com/mono-tec/mono-sample-linux-build-lab" \
            -li true \
            -pm true \
            -D true

      # ============================================================
      # 10. Camera SBOM生成
      # ============================================================
      - name: Generate Camera SBOM
        shell: bash
        run: |
          sbom-tool generate \
            -b ./artifacts/publish/linux-build-lab-camera \
            -bc ./src/LinuxBuildLab.Camera \
            -pn linux-build-lab-camera \
            -pv "$VERSION" \
            -ps mono-tec \
            -nsb "https://github.com/mono-tec/mono-sample-linux-build-lab" \
            -li true \
            -pm true \
            -D true

      # ============================================================
      # 11. Sample OSS Notice生成
      #
      # SampleとCameraで出力先を分離します。
      # ============================================================
      - name: Generate Sample OSS notice
        shell: bash
        run: |
          source "$RUNNER_TEMP/onot-venv/bin/activate"

          rm -rf ./artifacts/license/linux-build-lab-sample
          mkdir -p ./artifacts/license/linux-build-lab-sample

          onot generate \
            -i ./artifacts/publish/linux-build-lab-sample/_manifest/spdx_2.2/manifest.spdx.json \
            -f markdown \
            --output-dir ./artifacts/license/linux-build-lab-sample

      # ============================================================
      # 12. Camera OSS Notice生成
      # ============================================================
      - name: Generate Camera OSS notice
        shell: bash
        run: |
          source "$RUNNER_TEMP/onot-venv/bin/activate"

          rm -rf ./artifacts/license/linux-build-lab-camera
          mkdir -p ./artifacts/license/linux-build-lab-camera

          onot generate \
            -i ./artifacts/publish/linux-build-lab-camera/_manifest/spdx_2.2/manifest.spdx.json \
            -f markdown \
            --output-dir ./artifacts/license/linux-build-lab-camera

      # ============================================================
      # 13. Sample Complianceファイルを整理
      #
      # 最終的に以下の3ファイルへ統一します。
      #
      # LICENSE
      # THIRD-PARTY-NOTICES.md
      # sbom.spdx.json
      # ============================================================
      - name: Prepare Sample compliance files
        shell: bash
        run: |
          COMPLIANCE_DIR="./artifacts/compliance/linux-build-lab-sample"

          rm -rf "$COMPLIANCE_DIR"
          mkdir -p "$COMPLIANCE_DIR"

          cp ./LICENSE \
            "$COMPLIANCE_DIR/LICENSE"

          NOTICE_FILE="$(find ./artifacts/license/linux-build-lab-sample \
            -maxdepth 1 \
            -type f \
            -name '*.md' \
            | head -n 1)"

          if [[ -z "$NOTICE_FILE" ]]; then
            echo "Sample OSS Notice file was not generated."
            exit 1
          fi

          cp "$NOTICE_FILE" \
            "$COMPLIANCE_DIR/THIRD-PARTY-NOTICES.md"

          cp \
            ./artifacts/publish/linux-build-lab-sample/_manifest/spdx_2.2/manifest.spdx.json \
            "$COMPLIANCE_DIR/sbom.spdx.json"

          echo "Sample compliance files:"
          find "$COMPLIANCE_DIR" -maxdepth 1 -type f -print

      # ============================================================
      # 14. Camera Complianceファイルを整理
      # ============================================================
      - name: Prepare Camera compliance files
        shell: bash
        run: |
          COMPLIANCE_DIR="./artifacts/compliance/linux-build-lab-camera"

          rm -rf "$COMPLIANCE_DIR"
          mkdir -p "$COMPLIANCE_DIR"

          cp ./LICENSE \
            "$COMPLIANCE_DIR/LICENSE"

          NOTICE_FILE="$(find ./artifacts/license/linux-build-lab-camera \
            -maxdepth 1 \
            -type f \
            -name '*.md' \
            | head -n 1)"

          if [[ -z "$NOTICE_FILE" ]]; then
            echo "Camera OSS Notice file was not generated."
            exit 1
          fi

          cp "$NOTICE_FILE" \
            "$COMPLIANCE_DIR/THIRD-PARTY-NOTICES.md"

          cp \
            ./artifacts/publish/linux-build-lab-camera/_manifest/spdx_2.2/manifest.spdx.json \
            "$COMPLIANCE_DIR/sbom.spdx.json"

          echo "Camera compliance files:"
          find "$COMPLIANCE_DIR" -maxdepth 1 -type f -print

      # ============================================================
      # 15. Sample deb作成
      #
      # PACKAGE_VERSION:
      #   Gitタグから生成したVERSION
      #
      # PUBLISH_DIR:
      #   Sampleのpublish成果物
      #
      # COMPLIANCE_DIR:
      #   LICENSE / NOTICE / SBOM
      # ============================================================
      - name: Build Sample deb package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ env.VERSION }}
          PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/linux-build-lab-sample
          COMPLIANCE_DIR: ${{ github.workspace }}/artifacts/compliance/linux-build-lab-sample
        run: |
          chmod +x ./packaging/sample-deb/build-deb.sh
          ./packaging/sample-deb/build-deb.sh

      # ============================================================
      # 16. Camera deb作成
      # ============================================================
      - name: Build Camera deb package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ env.VERSION }}
          PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/linux-build-lab-camera
          COMPLIANCE_DIR: ${{ github.workspace }}/artifacts/compliance/linux-build-lab-camera
        run: |
          chmod +x ./packaging/camera-deb/build-deb.sh
          ./packaging/camera-deb/build-deb.sh

      # ============================================================
      # 17. Sample deb内容確認
      #
      # GitHub Actions上でパッケージ内部を確認します。
      # ============================================================
      - name: Inspect Sample deb package
        shell: bash
        run: |
          DEB_FILE="./artifacts/packages/linux-build-lab-sample_${VERSION}_amd64.deb"

          echo "Sample package:"
          ls -lh "$DEB_FILE"

          echo
          echo "Sample package contents:"
          dpkg-deb --contents "$DEB_FILE"

      # ============================================================
      # 18. Camera deb内容確認
      # ============================================================
      - name: Inspect Camera deb package
        shell: bash
        run: |
          DEB_FILE="./artifacts/packages/linux-build-lab-camera_${VERSION}_amd64.deb"

          echo "Camera package:"
          ls -lh "$DEB_FILE"

          echo
          echo "Camera package contents:"
          dpkg-deb --contents "$DEB_FILE"

      # ============================================================
      # 19. Workflow Artifact
      #
      # GitHub Actionsの実行結果として、
      # Sample / Camera のdebとComplianceファイルを保存します。
      #
      # ZIPは作成しません。
      # ============================================================
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: LinuxBuildLab-${{ env.VERSION }}
          path: |
            artifacts/packages/linux-build-lab-sample_${{ env.VERSION }}_amd64.deb
            artifacts/packages/linux-build-lab-camera_${{ env.VERSION }}_amd64.deb
            artifacts/compliance/linux-build-lab-sample/*
            artifacts/compliance/linux-build-lab-camera/*
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 20. GitHub Release
      #
      # Release Assetsにはdebだけを配置します。
      #
      # cloud-initはGitHub Releasesのlatestから、
      # PACKAGE_NAMEに一致するdebを取得します。
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/packages/linux-build-lab-sample_${{ env.VERSION }}_amd64.deb
            artifacts/packages/linux-build-lab-camera_${{ env.VERSION }}_amd64.deb
          generate_release_notes: true