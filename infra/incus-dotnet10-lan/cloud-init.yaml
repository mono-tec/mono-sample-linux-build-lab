#cloud-config

package_update: true
package_upgrade: false

packages:
  - git
  - curl
  - unzip
  - openssh-server
  - dotnet-runtime-10.0

users:
  - name: ubuntu
    gecos: Ubuntu
    groups:
      - adm
      - sudo
    shell: /bin/bash
    sudo:
      - ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_pwauth: false

write_files:
  # macvlan側NICでIPv4アドレスを取得する設定
  - path: /etc/netplan/60-eth1.yaml
    owner: root:root
    permissions: "0600"
    content: |
      network:
        version: 2
        ethernets:
          eth1:
%{ if network_mode == "dhcp" ~}
            dhcp4: true
%{ else ~}
            dhcp4: false
            addresses:
              - ${guest_ipv4_address}/${guest_ipv4_prefix}
%{ endif }
            dhcp6: true

  # GitHub Releaseから検証用アプリを取得するスクリプト
  - path: /usr/local/bin/install-linux-build-lab-sample.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      APP_NAME="LinuxBuildLab.Sample"
      APP_DIR="/opt/linux-build-lab"
      DOWNLOAD_FILE="/tmp/${release_asset_name}"
      DOWNLOAD_URL="https://github.com/${github_repository}/releases/download/${release_version}/${release_asset_name}"

      echo "[INFO] Download URL: $${DOWNLOAD_URL}"
      echo "[INFO] Install directory: $${APP_DIR}"

      mkdir -p "$${APP_DIR}"

      curl \
        --fail \
        --location \
        --retry 3 \
        --retry-delay 5 \
        --output "$${DOWNLOAD_FILE}" \
        "$${DOWNLOAD_URL}"

      unzip -o "$${DOWNLOAD_FILE}" -d "$${APP_DIR}"

      chmod +x "$${APP_DIR}/$${APP_NAME}"
      rm -f "$${DOWNLOAD_FILE}"

      echo "[INFO] Application installation completed."

runcmd:
  # SSHパスワード認証は無効のまま、
  # 公開鍵認証を許可するためubuntuアカウントのロックを解除
  - |
    PASSWORD_HASH=$(openssl passwd -6 "$(openssl rand -hex 32)")
    usermod -p "$PASSWORD_HASH" ubuntu

  # SSHサーバーを起動
  - systemctl enable --now ssh

  # macvlan側NICの設定を反映
  - netplan generate
  - netplan apply

  # .NET Runtime情報をログへ保存
  - dotnet --info > /var/log/dotnet-runtime-info.log 2>&1

  # 検証用アプリを取得して配置
  - /usr/local/bin/install-linux-build-lab-sample.sh > /var/log/linux-build-lab-install.log 2>&1

  # 検証用アプリを実行
  - /opt/linux-build-lab/LinuxBuildLab.Sample > /var/log/linux-build-lab-sample.log 2>&1